name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Pure-Java core tests (no Minecraft needed)
      - name: Core logic tests
        run: |
          mkdir -p /tmp/out
          C=src/main/java/com/creatorshq/master/core
          javac -d /tmp/out $C/Theme.java $C/ThemeManager.java $C/KeyConflicts.java $C/HqConfig.java $C/ConfigValidator.java tests/CoreLogicTest.java
          java -cp /tmp/out CoreLogicTest

      # Repo has no gradle wrapper, so install Gradle directly
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2

      - name: Build
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: creators-hq-master-mod
          path: build/libs/*.jar
